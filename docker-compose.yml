services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parcelpilot-postgres
    environment:
      POSTGRES_USER: parcelpilot
      POSTGRES_PASSWORD: parcelpilot
      POSTGRES_DB: parcelpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpilot -d parcelpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parcelpilot-server
    environment:
      DATABASE_URL: postgres://parcelpilot:parcelpilot@postgres:5432/parcelpilot
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      SERVER_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
