services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parcelpilot-postgres
    environment:
      POSTGRES_USER: parcelpilot
      POSTGRES_PASSWORD: parcelpilot
      POSTGRES_DB: parcelpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpilot -d parcelpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: